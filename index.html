<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,maximum-scale=1,viewport-fit=cover">
<title>iBeer 2026 — Liquid Chaos</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
body{
  background:radial-gradient(ellipse at 50% 30%,#2a1508 0%,#0d0704 70%,#000 100%);
  font-family:'Helvetica Neue',Arial,sans-serif;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-height:100dvh;padding:0;position:relative;
}
.bar-bg{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(139,69,19,0.12) 0%,transparent 30%,rgba(139,69,19,0.08) 100%),
  radial-gradient(ellipse at 20% 40%,rgba(255,200,50,0.03),transparent 50%),
  radial-gradient(ellipse at 80% 40%,rgba(255,100,50,0.03),transparent 50%),
  repeating-linear-gradient(90deg,rgba(40,20,10,0.3) 0px,rgba(40,20,10,0.1) 2px,rgba(40,20,10,0.3) 4px);}
.bar-bg::before{content:'';position:absolute;bottom:0;left:0;right:0;height:25%;background:repeating-linear-gradient(0deg,transparent 0px,transparent 28px,rgba(80,30,10,0.08) 28px,rgba(80,30,10,0.08) 30px),repeating-linear-gradient(90deg,transparent 0px,transparent 58px,rgba(80,30,10,0.05) 58px,rgba(80,30,10,0.05) 60px);}
.neon-glow{position:fixed;top:10px;left:50%;transform:translateX(-50%);z-index:0;pointer-events:none;font-size:36px;color:#ff69b4;text-shadow:0 0 20px #ff69b4,0 0 40px #ff69b4,0 0 80px #ff1493;opacity:.6;letter-spacing:10px;white-space:nowrap}
.shelf-line{position:fixed;bottom:80px;left:0;right:0;height:4px;z-index:0;pointer-events:none;background:linear-gradient(90deg,transparent,rgba(139,69,19,0.2) 10%,rgba(139,69,19,0.3) 50%,rgba(139,69,19,0.2) 90%,transparent);box-shadow:0 2px 8px rgba(0,0,0,.3);}

.container{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:6px;width:100%;max-width:360px}
.phone{width:100%;max-width:320px;aspect-ratio:9/16;background:linear-gradient(145deg,#1a1a1a,#2a2a2a);border-radius:36px;padding:10px;position:relative;box-shadow:0 0 0 2px #333,0 0 0 4px #111,0 15px 40px rgba(0,0,0,.8);}
.notch{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:130px;height:26px;background:#111;border-radius:0 0 14px 14px;z-index:10;}
.notch::before{content:'';position:absolute;top:7px;left:50%;transform:translateX(-50%);width:9px;height:9px;background:radial-gradient(circle,#1a1a3a 30%,#111 70%);border-radius:50%;border:1px solid #222}
.screen{width:100%;height:100%;border-radius:27px;overflow:hidden;background:linear-gradient(180deg,#3e1f0d 0%,#2a1508 50%,#1a0e04 100%);display:flex;flex-direction:column;align-items:center;position:relative;}

.drink-selector{width:100%;padding:26px 8px 2px;display:grid;grid-template-columns:repeat(5,1fr);gap:2px;flex-shrink:0}
.drink-btn{padding:2px 4px;border-radius:8px;font-size:8px;font-weight:600;cursor:pointer;border:1px solid rgba(255,215,0,.15);background:rgba(0,0,0,.3);color:rgba(255,255,200,.35);transition:all .1s;touch-action:manipulation;white-space:nowrap;text-align:center;line-height:1.2}
.drink-btn.active{border-color:#ffd700;background:rgba(255,215,0,.12);color:#ffd700;box-shadow:0 0 6px rgba(255,215,0,.08)}
.drink-btn:active{transform:scale(.92)}

.glass-area{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;perspective:600px}
.glasses-wrap{position:relative;width:150px;height:190px;margin:0 auto}
.glass{position:absolute;bottom:0;left:50%;width:130px;height:165px;transition:transform .06s ease;z-index:2}
.glass-body{position:absolute;bottom:0;left:0;width:100%;height:100%;
  background:linear-gradient(90deg,rgba(200,160,120,.12),rgba(255,255,255,.03) 30%,rgba(200,160,120,.18) 60%,rgba(255,255,255,.05));
  border:2px solid rgba(200,160,120,.25);border-radius:0 0 10px 10px;overflow:visible;backdrop-filter:blur(1px);
  transform-style:preserve-3d;perspective:400px;}
.glass-body::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.2),transparent);z-index:10}
.glass-body::after{content:'';position:absolute;top:0;left:10%;width:80%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.04) 30%,transparent 70%);pointer-events:none;z-index:11}
.handle{position:absolute;right:-17px;top:32px;width:18px;height:40px;border:2px solid rgba(200,160,120,.15);border-radius:0 8px 8px 0;border-left:none;z-index:1}

.liquid-wrap{position:absolute;bottom:0;left:0;width:100%;height:100%;overflow:hidden;border-radius:0 0 8px 8px;z-index:2}
.liquid{position:absolute;bottom:0;left:0;width:100%;height:100%;border-radius:0 0 8px 8px;z-index:2;transition:none}
.liquid-layer{position:absolute;bottom:0;left:0;width:100%;border-radius:0 0 8px 8px;z-index:2;transition:height .15s cubic-bezier(.4,0,.2,1)}
.liquid-layer::after{content:'';position:absolute;top:-2px;left:0;right:0;height:6px;background:radial-gradient(ellipse at 50% 100%,rgba(255,255,255,.15),transparent);border-radius:50%}
.liquid-shine{position:absolute;top:2px;left:5%;width:90%;height:3px;background:linear-gradient(90deg,transparent,rgba(255,255,220,.3),transparent);border-radius:50%;z-index:3;pointer-events:none}

.foam{position:absolute;bottom:0;left:0;width:100%;height:100%;z-index:3;transition:height .15s ease;border-radius:0 0 8px 8px;pointer-events:none}
.foam.beer{background:linear-gradient(180deg,rgba(255,255,255,.95) 0%,rgba(255,255,240,.88) 6%,rgba(255,230,200,.5) 12%,transparent 18%)}
.foam.none{background:transparent}

.ice-wrap{position:absolute;bottom:0;left:0;width:100%;height:100%;z-index:5;pointer-events:none;overflow:hidden;border-radius:0 0 8px 8px}
.ice-cube{position:absolute;border-radius:3px;z-index:5;pointer-events:none;width:10px;height:10px;box-shadow:inset 0 0 0 1px rgba(255,255,255,0.2);transition:none}

.bubble-container{position:absolute;bottom:0;left:0;width:100%;height:100%;z-index:4;pointer-events:none;overflow:hidden}
.bubble{position:absolute;border-radius:50%;animation:rise linear infinite}
@keyframes rise{0%{transform:translateY(0) scale(1);opacity:.7}100%{transform:translateY(-175px) scale(.2);opacity:0}}

.glug-overlay{position:absolute;bottom:0;left:0;width:100%;height:100%;z-index:6;pointer-events:none}
.glug-wave{position:absolute;bottom:0;left:-10%;width:120%;height:0%;background:rgba(255,200,100,.08);border-radius:40%}
.glug-wave.go{height:30%;animation:glug .8s ease-out forwards}
@keyframes glug{0%{height:0%;opacity:1}50%{height:35%;opacity:.5;border-radius:30%}100%{height:0%;opacity:0;border-radius:50%}}

.status{font-size:12px;font-weight:600;color:rgba(255,255,200,.65);text-shadow:0 1px 3px rgba(0,0,0,.5);text-align:center;min-height:18px;margin-top:1px}

.bottoms{flex-shrink:0;width:100%;padding:3px 10px 2px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px}
.inst{font-size:9px;color:rgba(255,255,200,.3);display:flex;align-items:center;gap:4px;justify-content:center;min-height:14px}
.inst .pulse{font-size:11px;animation:blink 2s infinite}
@keyframes blink{0%,100%{opacity:.4}50%{opacity:1}}
.counter{font-size:9px;color:rgba(255,255,200,.2)}
.btn-wrap{display:flex;gap:6px;margin-top:1px;flex-wrap:wrap;justify-content:center}
.btn{padding:4px 12px;border:none;border-radius:14px;font-size:10px;font-weight:700;cursor:pointer;background:linear-gradient(135deg,#d4a017,#b8860b);color:#fff;box-shadow:0 2px 6px rgba(0,0,0,.3);transition:all .12s;touch-action:manipulation}
.btn:active{transform:scale(.92)}
.btn.gyro{background:linear-gradient(135deg,#4a90d9,#357abd);display:none}
.btn.ice{background:linear-gradient(135deg,#4fc3f7,#0288d1)}
.btn.trash{background:linear-gradient(135deg,#ef5350,#c62828);display:none}
.btn.spill{background:linear-gradient(135deg,#7b1fa2,#4a148c)}
.spill-meter{height:3px;border-radius:2px;background:rgba(255,255,200,.1);width:80%;margin:1px auto;overflow:hidden}
.spill-fill{height:100%;border-radius:2px;background:linear-gradient(90deg,#4fc3f7,#e53935);width:0%;transition:width .3s}

.sip-indicator{font-size:12px;color:rgba(255,215,0,.08);margin-top:1px;min-height:16px;letter-spacing:1px}

/* Spill effect */
.spill-puddle{position:absolute;bottom:-10px;left:10%;width:80%;height:0px;z-index:1;border-radius:50%;transition:height .5s,opacity .5s;opacity:0;pointer-events:none}

/* Samsung ad */
.samsung-ad{position:absolute;bottom:0;left:0;right:0;height:22px;z-index:15;
  background:linear-gradient(90deg,rgba(20,30,80,0.9),rgba(30,50,120,0.85),rgba(20,30,80,0.9));
  border-top:1px solid rgba(100,150,255,.15);
  display:flex;align-items:center;justify-content:center;gap:4px;
  font-size:7px;color:rgba(200,220,255,.5);letter-spacing:.5px;backdrop-filter:blur(2px);overflow:hidden;}
.samsung-ad .logo{font-size:9px;font-weight:800;color:rgba(200,220,255,.7);letter-spacing:1px}
.samsung-ad .text{color:rgba(200,220,255,.4)}
.samsung-ad .btn-ad{padding:1px 6px;border-radius:6px;background:rgba(255,255,255,.1);color:rgba(200,220,255,.6);font-size:6px;font-weight:600}

.mix-label{position:absolute;top:4px;left:0;right:0;text-align:center;font-size:7px;color:rgba(255,255,200,.25);z-index:12;pointer-events:none}
</style>
</head>
<body>
<div class="bar-bg"></div>
<div class="neon-glow">CHAOS</div>
<div class="shelf-line"></div>

<div class="container">
  <div class="phone" id="phone">
    <div class="notch"></div>
    <div class="screen">
      <div class="drink-selector" id="drinkSelector"></div>
      <div class="glass-area">
        <div class="glasses-wrap">
          <div class="glass" id="glass">
            <div class="glass-body">
              <div class="handle"></div>
              <div class="liquid-wrap" id="liquidWrap">
                <div class="liquid" id="liquid"></div>
                <div class="foam" id="foam"></div>
                <div class="ice-wrap" id="iceWrap"></div>
                <div class="bubble-container" id="bubbleCon"></div>
                <div class="mix-label" id="mixLabel"></div>
              </div>
              <div class="spill-puddle" id="spillPuddle"></div>
            </div>
          </div>
          <div class="glug-overlay"><div class="glug-wave" id="glugWave"></div></div>
        </div>
        <div class="status" id="status">🍻 liquid chaos</div>
        <div class="spill-meter"><div class="spill-fill" id="spillFill"></div></div>
      </div>
      <div class="bottoms">
        <div class="inst"><span class="pulse" id="instIcon">📱</span><span id="instText">Tap to enable</span></div>
        <div class="counter" id="counter">0 drinks</div>
        <div class="btn-wrap">
          <button class="btn gyro" id="gyroBtn">Gyro</button>
          <button class="btn" id="resetBtn">🔄 Refill</button>
          <button class="btn ice" id="iceBtn">🧊 Ice</button>
          <button class="btn trash" id="trashBtn">🗑️</button>
        </div>
        <div class="sip-indicator" id="sipDots">··········</div>
      </div>
      <div class="samsung-ad">
        <span class="logo">SΛMSUNG</span>
        <span class="text">Galaxy S26 Ultra</span>
        <span class="btn-ad">Learn More</span>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
  'use strict';

  const L=document.getElementById('liquid');
  const F=document.getElementById('foam');
  const S=document.getElementById('status');
  const C=document.getElementById('counter');
  const I=document.getElementById('instText');
  const II=document.getElementById('instIcon');
  const R=document.getElementById('resetBtn');
  const G=document.getElementById('gyroBtn');
  const glass=document.getElementById('glass');
  const BC=document.getElementById('bubbleCon');
  const SD=document.getElementById('sipDots');
  const GW=document.getElementById('glugWave');
  const iceWrap=document.getElementById('iceWrap');
  const iceBtn=document.getElementById('iceBtn');
  const trashBtn=document.getElementById('trashBtn');
  const drinkSel=document.getElementById('drinkSelector');
  const mixLabel=document.getElementById('mixLabel');
  const spillPuddle=document.getElementById('spillPuddle');
  const spillFill=document.getElementById('spillFill');

  // === LIQUID DATABASE ===
  const LIQUIDS={
    beer:{name:'🍺 Beer',color:'linear-gradient(180deg,#f5d742 0%,#d4a017 10%,#c8960e 25%,#b8860b 45%,#8B6914 65%,#6B4E0A 80%,#4a3508 100%)',foam:'beer',density:1.01,viscosity:0.3,temp:4,bubbleRate:0.3,bubbleColor:'rgba(255,255,200,0.5)',meltRate:0.1,toxic:false,glow:false},
    whiskey:{name:'🥃 Whiskey',color:'linear-gradient(180deg,#c8953c 0%,#a07628 15%,#8B5E14 40%,#6B4510 65%,#4a3008 100%)',foam:'none',density:0.95,viscosity:0.6,temp:20,bubbleRate:0.05,bubbleColor:'rgba(255,200,150,0.3)',meltRate:0.3,toxic:false,glow:false},
    wine:{name:'🍷 Wine',color:'linear-gradient(180deg,#8B2252 0%,#7B1842 15%,#6B1038 40%,#5A082E 65%,#400020 100%)',foam:'none',density:1.01,viscosity:0.4,temp:18,bubbleRate:0.08,bubbleColor:'rgba(200,50,100,0.3)',meltRate:0.2,toxic:false,glow:false},
    cocktail:{name:'🍹 Cocktail',color:'linear-gradient(180deg,#ff6b8a 0%,#e84a6a 15%,#d4385a 40%,#b82848 65%,#901838 100%)',foam:'none',density:1.02,viscosity:0.5,temp:4,bubbleRate:0.15,bubbleColor:'rgba(255,100,150,0.4)',meltRate:0.1,toxic:false,glow:false},
    water:{name:'💧 Water',color:'linear-gradient(180deg,rgba(100,180,255,.5) 0%,rgba(60,140,220,.35) 15%,rgba(40,120,200,.25) 40%,rgba(20,100,180,.15) 65%,rgba(10,80,160,.1) 100%)',foam:'none',density:1.0,viscosity:0.2,temp:20,bubbleRate:0.1,bubbleColor:'rgba(200,220,255,0.3)',meltRate:0.2,toxic:false,glow:false},
    coffee:{name:'☕ Coffee',color:'linear-gradient(180deg,#3c1f0a 0%,#2a1508 15%,#1a0e04 40%,#0d0702 65%,#000 100%)',foam:'none',density:1.02,viscosity:0.35,temp:70,bubbleRate:0.2,bubbleColor:'rgba(180,120,60,0.3)',meltRate:2,toxic:false,glow:false},
    tea:{name:'🍵 Tea',color:'linear-gradient(180deg,#8B6914 0%,#6B4E0A 20%,#5A3E08 40%,#4a3008 60%,#3a2006 80%,#2a1508 100%)',foam:'none',density:1.0,viscosity:0.25,temp:80,bubbleRate:0.12,bubbleColor:'rgba(180,140,60,0.3)',meltRate:2.5,toxic:false,glow:false},
    milk:{name:'🥛 Milk',color:'linear-gradient(180deg,rgba(255,255,240,.85) 0%,rgba(240,240,230,.7) 20%,rgba(220,220,210,.5) 50%,rgba(200,200,190,.35) 75%,rgba(180,180,170,.2) 100%)',foam:'none',density:1.03,viscosity:0.5,temp:4,bubbleRate:0.15,bubbleColor:'rgba(255,255,255,0.4)',meltRate:0.15,toxic:false,glow:false},
    piss:{name:'💛 Piss',color:'linear-gradient(180deg,#e8c828 0%,#d4a817 15%,#c89814 30%,#b08010 50%,#906808 70%,#705008 100%)',foam:'none',density:1.01,viscosity:0.2,temp:37,bubbleRate:0.2,bubbleColor:'rgba(200,180,50,0.4)',meltRate:0.5,toxic:false,glow:false},
    mercury:{name:'🪬 Mercury',color:'linear-gradient(180deg,rgba(180,180,185,.9) 0%,rgba(160,160,165,.85) 20%,rgba(140,140,145,.8) 40%,rgba(120,120,125,.7) 60%,rgba(100,100,105,.55) 80%,rgba(80,80,85,.4) 100%)',foam:'none',density:13.6,viscosity:0.8,temp:20,bubbleRate:0,bubbleColor:'transparent',meltRate:1,toxic:true,glow:false},
    'rat-poison':{name:'🐀 Rat Poison',color:'linear-gradient(180deg,#7CFC00 0%,#32CD32 15%,#228B22 40%,#006400 65%,#004d00 100%)',foam:'none',density:1.5,viscosity:0.7,temp:20,bubbleRate:0.1,bubbleColor:'rgba(50,200,50,0.4)',meltRate:0.3,toxic:true,glow:true},
    lava:{name:'🌋 Lava',color:'linear-gradient(180deg,#ff4500 0%,#ff6600 10%,#ff3300 25%,#cc2200 45%,#990000 65%,#660000 85%,#330000 100%)',foam:'none',density:3.1,viscosity:2,temp:1200,bubbleRate:0.8,bubbleColor:'rgba(255,100,0,0.6)',meltRate:10,toxic:true,glow:true},
    sludge:{name:'☢️ Sludge',color:'linear-gradient(180deg,#39ff14 0%,#2ecc10 10%,#239d0c 25%,#187008 45%,#0d4504 65%,#062002 100%)',foam:'none',density:1.8,viscosity:0.9,temp:40,bubbleRate:0.6,bubbleColor:'rgba(50,255,20,0.5)',meltRate:0.5,toxic:true,glow:true},
    bleach:{name:'🧴 Bleach',color:'linear-gradient(180deg,rgba(220,255,255,.8) 0%,rgba(200,240,255,.65) 20%,rgba(180,220,240,.5) 50%,rgba(160,200,220,.35) 75%,rgba(140,180,200,.2) 100%)',foam:'none',density:1.1,viscosity:0.3,temp:20,bubbleRate:0.7,bubbleColor:'rgba(200,240,255,0.5)',meltRate:0.8,toxic:true,glow:false},
    acid:{name:'🧪 Acid',color:'linear-gradient(180deg,#00ff88 0%,#00cc66 15%,#009944 40%,#006622 65%,#003311 100%)',foam:'none',density:1.4,viscosity:0.3,temp:25,bubbleRate:0.9,bubbleColor:'rgba(0,255,136,0.5)',meltRate:3,toxic:true,glow:true}
  };

  const DRINKS=Object.keys(LIQUIDS);

  // === State ===
  let level=100, drunk=0;
  let gyro=false, listened=false;
  let cal=null, accum=0, drinking=false;
  let lastBeta=0, lastGamma=0;
  let currentLiquid='beer';
  let glassContents=[{id:'beer',pct:100}];
  let iceCubes=[];
  let spillDanger=0;

  // === Build drink selector ===
  DRINKS.forEach(id=>{
    const b=document.createElement('button');
    b.className='drink-btn'+(id==='beer'?' active':'');
    b.dataset.drink=id;
    b.textContent=LIQUIDS[id].name;
    b.addEventListener('click',()=>selectDrink(id));
    drinkSel.appendChild(b);
  });

  // === Bubbles ===
  let bubbleTimer=0;

  function spawnBubble(count,color){
    for(let i=0;i<count;i++){
      const b=document.createElement('div');
      b.className='bubble';
      const s=1.5+Math.random()*3;
      b.style.cssText=`
        left:${8+Math.random()*84}%;bottom:${Math.random()*30}%;
        width:${s}px;height:${s}px;
        background:radial-gradient(circle at 30% 30%,${color||'rgba(255,255,255,0.5)'},rgba(255,255,255,0.15));
        animation-duration:${1+Math.random()*2}s;animation-delay:${Math.random()*1.5}s`;
      BC.appendChild(b);
      setTimeout(()=>b.remove(),3000);
    }
  }

  // === Ice ===
  function addIce(count){
    for(let i=0;i<count;i++){
      const c=document.createElement('div');
      c.className='ice-cube';
      const size=7+Math.random()*7;
      const topOff=5+Math.random()*50;
      c.style.cssText=`
        width:${size}px;height:${size}px;
        left:${5+Math.random()*60}%;bottom:${topOff}%;
        background:radial-gradient(circle at 30% 30%,rgba(255,255,255,0.5),rgba(180,210,255,0.2));
        border-radius:${1+Math.random()*3}px;
        transform:rotate(${Math.random()*360}deg);
      `;
      c.dataset.vx=((Math.random()-0.5)*0.5).toString();
      c.dataset.vy=((Math.random()-0.5)*0.3).toString();
      c.dataset.melt=Math.max(10,100-Math.floor(Math.random()*40)).toString();
      iceWrap.appendChild(c);
    }
    trimIce();
  }

  function trimIce(){
    const ices=iceWrap.querySelectorAll('.ice-cube');
    if(ices.length>40){for(let i=0;i<ices.length-40;i++)ices[i].remove();}
    trashBtn.style.display=ices.length>0?'inline-block':'none';
  }

  function clearIce(){
    iceWrap.innerHTML='';
    trashBtn.style.display='none';
  }

  // === Spill ===
  function spillAmt(amt){
    if(level<=0)return;
    level=Math.max(0,level-amt);
    spillDanger=Math.min(100,spillDanger+amt*3);
    // Puddle grows
    const h=spillDanger*0.15;
    const topLiq=getTopLiquid();
    const liq=LIQUIDS[topLiq];
    spillPuddle.style.height=h+'px';
    spillPuddle.style.opacity=Math.min(0.6,spillDanger*0.006).toString();
    const grad=liq.color.replace('180deg','90deg').replace('100%','100%)');
    spillPuddle.style.background=grad;
    spillPuddle.style.bottom=(-4-h)+'px';

    updateDisplay();
    S.textContent='💦 SPILLING!';
    setTimeout(()=>{
      if(spillDanger<10){spillPuddle.style.opacity='0';spillPuddle.style.height='0px';}
    },2000);
  }

  // === Liquid selection and mixing ===
  function selectDrink(id){
    // Mix: add new liquid on top (old stays, gets diluted)
    const existing=glassContents.find(g=>g.id===id);
    if(existing){
      existing.pct=Math.min(100,existing.pct+15);
      // Dilute others proportionally
      const total=glassContents.reduce((s,g)=>s+g.pct,0);
      if(total>100+id.length){
        glassContents.forEach(g=>{
          if(g.id!==id)g.pct=Math.max(1,g.pct-(g.pct/total)*15);
        });
      }
    }else{
      glassContents.push({id:id,pct:20});
    }
    // Remove empty
    glassContents=glassContents.filter(g=>g.pct>1);
    // Normalize to 100
    const total=glassContents.reduce((s,g)=>s+g.pct,0);
    if(total>0){
      glassContents.forEach(g=>g.pct=(g.pct/total)*100);
    }

    currentLiquid=id;
    drinkBtnsSync();
    updateDisplay();

    // Bubble burst on new liquid
    const liq=LIQUIDS[id];
    if(liq.glow)S.style.color='#39ff14';
    else S.style.color='';
    spawnBubble(Math.floor(5+Math.random()*10),liq.bubbleColor);

    // Toxic warning
    if(liq.toxic){
      if(liq.temp>200)S.textContent='🔥 '+liq.name+' — MELTS GLASS!';
      else S.textContent='☠️ '+liq.name+' — TOXIC!';
    }else{
      S.textContent=liq.name;
    }

    updateFoam();
  }

  function drinkBtnsSync(){
    document.querySelectorAll('.drink-btn').forEach(b=>{
      b.classList.toggle('active',b.dataset.drink===currentLiquid);
    });
  }

  function getTopLiquid(){
    // Sort by density desc (heaviest at bottom), return top (lowest density)
    const sorted=[...glassContents].sort((a,b)=>LIQUIDS[b.id].density-LIQUIDS[a.id].density);
    return sorted.length>0?sorted[sorted.length-1].id:'beer';
  }

  // === Display ===
  function updateDisplay(){
    // Sort liquids by density (heaviest at bottom)
    const sorted=[...glassContents].sort((a,b)=>LIQUIDS[a.id].density-LIQUIDS[b.id].density);
    L.innerHTML='';
    let cumH=0;
    sorted.forEach((g,i)=>{
      const layer=document.createElement('div');
      layer.className='liquid-layer';
      const h=(g.pct/100)*level;
      layer.style.height=h+'%';
      layer.style.bottom=cumH+'%';
      layer.style.background=LIQUIDS[g.id].color;
      layer.style.zIndex=(10-i).toString();
      layer.style.opacity=Math.min(1,0.5+(g.pct/100)*0.5).toString();
      L.appendChild(layer);
      cumH+=h;
    });

    // Mix label
    const names=glassContents.map(g=>LIQUIDS[g.id].name).join(' + ');
    mixLabel.textContent=names.length>30?names.slice(0,30)+'…':names;

    // Spill meter
    spillFill.style.width=spillDanger+'%';

    // Level dots
    const dots=Math.floor(level/10);
    SD.textContent='🍺'.repeat(dots)+(dots<10?'·'.repeat(10-dots):'');
  }

  function updateFoam(){
    const top=getTopLiquid();
    const liq=LIQUIDS[top];
    F.className='foam '+(liq.foam||'none');
    F.style.height=Math.min(100,level+2)+'%';
  }

  // === Main update ===
  function updateAll(lvl,drinkId){
    level=Math.max(0,Math.min(100,lvl));
    updateDisplay();
    updateFoam();
  }

  function drain(amt){
    if(level<=0)return;
    updateAll(level-amt);
    GW.className='glug-wave go';
    setTimeout(()=>GW.className='glug-wave',800);
  }

  function refill(){
    level=100;spillDanger=0;
    spillPuddle.style.opacity='0';spillPuddle.style.height='0px';
    glassContents=[{id:currentLiquid,pct:100}];
    accum=0;drinking=false;
    glass.style.transform='translateX(-50%) rotateX(0deg)';
    I.textContent=gyro?'Tilt back to drink':'Drag down to drink';II.textContent=gyro?'📱':'🖱️';
    const liq=LIQUIDS[currentLiquid];
    S.textContent=liq.name;S.style.color='';
    updateDisplay();
    updateFoam();
    addIce(2+Math.floor(Math.random()*3));
  }

  // === GYRO ===
  function handleOrientation(e){
    if(!gyro)return;
    const b=e.beta, g=e.gamma;
    if(b===null||b===undefined)return;
    listened=true;
    if(cal===null)cal=b;

    const delta=cal-b;
    lastBeta=delta;
    lastGamma=g||0;

    const liq=LIQUIDS[getTopLiquid()];
    const visc=liq?liq.viscosity:0.3;

    // Glass tilt
    let gt=0;
    if(Math.abs(delta)>8){
      gt=Math.min(45,Math.abs(delta)*(delta>0?0.3:0.12))*Math.sign(delta);
      glass.style.transform=`translateX(-50%) rotateX(${gt}deg)`;
    }else{
      glass.style.transform='translateX(-50%) rotateX(0deg)';
    }

    // Spill if tilt too far (>40°)
    const absTilt=Math.abs(delta);
    if(absTilt>35&&level>5){
      const spillRate=(absTilt-35)/40*(1/visc);
      // Melt ice faster with hot liquids
      if(liq&&liq.temp>50){
        document.querySelectorAll('.ice-cube').forEach(c=>{
          let melt=parseInt(c.dataset.melt)||20;
          melt-=Math.max(1,liq.meltRate*0.5);
          if(melt<=0){c.remove();}
          else c.dataset.melt=melt.toString();
        });
      }
      // Steam bubbles for hot liquids
      if(liq&&liq.temp>60){
        spawnBubble(Math.floor(Math.random()*3),'rgba(200,200,200,0.3)');
      }
      // Glowing bubbles for radioactive
      if(liq&&liq.glow){
        spawnBubble(1,'rgba(50,255,20,0.5)');
      }
      spillAmt(spillRate);
    }else{
      // Slow spill evaporation when upright
      if(spillDanger>0)spillDanger=Math.max(0,spillDanger-0.3);
    }

    // Drink
    if(delta>18){
      if(!drinking){drinking=true;accum=0;}
      const rate=(delta-18)/70;
      accum+=rate*0.5/liq.viscosity;
      if(accum>=1){drain(1);accum=0;}
      I.textContent='🥴 Glug!';II.textContent='🥴';
    }else{
      if(drinking){drinking=false;accum=0;}
      I.textContent=delta>6?'Almost...':'Tilt back';
      II.textContent='📱';
    }
  }

  // === FALLBACK ===
  const GA=document.querySelector('.glass-area');
  let ds=0,dd=false;

  function sd(e){dd=true;ds=e.type.startsWith('t')?e.touches[0].clientY:e.clientY;accum=0;}
  function mv(e){
    if(!dd)return;
    const y=e.type.startsWith('t')?e.touches[0].clientY:e.clientY;
    const dy=y-ds;
    glass.style.transform=`translateX(-50%) rotateX(${Math.min(45,dy*0.15)}deg)`;
    if(dy>50){
      const rate=(dy-50)/100;
      spillAmt(rate);
    }
    if(dy>30){const rate=(dy-30)/120;accum+=rate*0.6;if(accum>=1){drain(1);accum=0;}I.textContent='🥴 Glug!';II.textContent='🥴';}
    else{I.textContent='⬇️ Drag';II.textContent='🖱️';}
  }
  function ed(){dd=false;accum=0;glass.style.transform='translateX(-50%) rotateX(0deg)';I.textContent=gyro?'Tilt back':'⬇️ Drag';II.textContent=gyro?'📱':'🖱️';}

  function enableFallback(){
    G.style.display='none';
    if(gyro)window.removeEventListener('deviceorientation',handleOrientation);
    gyro=false;
    I.textContent='⬇️ Drag down';II.textContent='🖱️';
    GA.addEventListener('mousedown',sd);
    document.addEventListener('mousemove',mv);
    document.addEventListener('mouseup',ed);
    GA.addEventListener('touchstart',function(e){sd(e);},{passive:true});
    document.addEventListener('touchmove',function(e){mv(e);},{passive:true});
    document.addEventListener('touchend',ed);
  }

  function initGyro(){
    if(typeof DeviceOrientationEvent==='undefined'){enableFallback();return;}
    if(typeof DeviceOrientationEvent.requestPermission==='function'){
      G.style.display='inline-block';G.textContent='🔒 Enable Gyroscope';
      G.addEventListener('click',async()=>{
        try{
          const s=await DeviceOrientationEvent.requestPermission();
          if(s==='granted'){
            window.addEventListener('deviceorientation',handleOrientation);
            gyro=true;G.style.display='none';cal=null;
            I.textContent='Tilt back to drink';II.textContent='📱';
            setTimeout(()=>{if(!listened)enableFallback();},3000);
          }else{enableFallback();}
        }catch(e){enableFallback();}
      });
    }else{
      window.addEventListener('deviceorientation',handleOrientation);
      gyro=true;G.style.display='none';cal=null;
      I.textContent='Tilt back to drink';II.textContent='📱';
      setTimeout(()=>{if(!listened)enableFallback();},3000);
    }
  }

  iceBtn.addEventListener('click',()=>addIce(3));
  trashBtn.addEventListener('click',clearIce);

  R.addEventListener('click',refill);
  document.addEventListener('keydown',e=>{if(e.key==='r'||e.key==='R')refill()});

  // === Ice physics loop ===
  let physFrame=null;
  function physicsLoop(){
    const ices=iceWrap.querySelectorAll('.ice-cube');
    if(ices.length>0){
      const g=lastGamma||0;
      const b=lastBeta||0;
      const forceX=g*0.3;
      const forceY=b*0.2;

      for(const c of ices){
        let left=parseFloat(c.style.left)||10;
        let bottom=parseFloat(c.style.bottom)||10;
        let vx=parseFloat(c.dataset.vx)||0;
        let vy=parseFloat(c.dataset.vy)||0;
        let melt=parseInt(c.dataset.melt)||20;
        const sz=parseFloat(c.style.width)||10;
        const w=iceWrap.clientWidth||126;
        const h=iceWrap.clientHeight||165;

        // Melt
        const topLiq=getTopLiquid();
        const liq=LIQUIDS[topLiq];
        if(liq&&liq.meltRate>0.5){
          melt-=liq.meltRate*0.05;
          if(melt<=0){c.remove();continue;}
          c.dataset.melt=melt.toString();
          // Shrink as it melts
          const shrink=1-(100-melt)/100*0.5;
          const ns=sz*shrink;
          c.style.width=Math.max(3,ns)+'px';
          c.style.height=Math.max(3,ns)+'px';
        }

        // Physics
        vx+=forceX*0.08;
        vy-=forceY*0.06;
        vy+=0.02;
        vx*=0.94;
        vy*=0.94;
        if(Math.abs(vx)>2)vx=Math.sign(vx)*2;
        if(Math.abs(vy)>2)vy=Math.sign(vy)*2;

        left+=vx*0.3;
        bottom+=vy*0.3;

        const szP=Math.max(sz,parseFloat(c.style.height)||10);
        if(left<1){left=1;vx=Math.abs(vx)*0.35;}
        if(left>100-szP*100/w-1){left=100-szP*100/w-1;vx=-Math.abs(vx)*0.35;}
        if(bottom<1){bottom=1;vy=Math.abs(vy)*0.35;}
        if(bottom>92){bottom=92;vy=-Math.abs(vy)*0.35;}

        // Ice-to-ice
        for(const d of ices){
          if(d===c)continue;
          const l2=parseFloat(d.style.left)||10,d2=parseFloat(d.style.bottom)||10;
          const sz2=parseFloat(d.style.width)||10;
          const dx=left-l2,dy=bottom-d2;
          const dist=Math.sqrt(dx*dx+dy*dy);
          const minDist=(sz/w*100+sz2/w*100)*0.6;
          if(dist<minDist&&dist>0.1){
            const overlap=minDist-dist,nx=dx/dist,ny=dy/dist;
            c.style.left=(left+nx*overlap*0.5)+'%';
            c.style.bottom=(bottom+ny*overlap*0.5)+'%';
            d.style.left=(l2-nx*overlap*0.5)+'%';
            d.style.bottom=(d2-ny*overlap*0.5)+'%';
            vx+=nx*0.3;
            vy+=ny*0.3;
            const vx2=parseFloat(d.dataset.vx)||0,vy2=parseFloat(d.dataset.vy)||0;
            d.dataset.vx=(vx2-nx*0.3).toString();
            d.dataset.vy=(vy2-ny*0.3).toString();
          }
        }

        c.dataset.vx=vx.toString();
        c.dataset.vy=vy.toString();
        c.style.left=left+'%';
        c.style.bottom=bottom+'%';
      }
    }

    // Regular bubble spawn
    bubbleTimer++;
    if(bubbleTimer%60===0){
      const top=LIQUIDS[getTopLiquid()];
      if(top&&top.bubbleRate>0&&level>0){
        const count=Math.floor(top.bubbleRate*3);
        if(count>0)spawnBubble(count,top.bubbleColor);
      }
    }

    physFrame=requestAnimationFrame(physicsLoop);
  }

  // === INIT ===
  updateAll(100,'beer');
  updateFoam();
  initGyro();
  physicsLoop();
  addIce(4);

  document.addEventListener('click',()=>{
    if(!gyro&&typeof DeviceOrientationEvent!=='undefined'&&typeof DeviceOrientationEvent.requestPermission!=='function'){
      window.addEventListener('deviceorientation',handleOrientation);
      gyro=true;cal=null;
      setTimeout(()=>{if(!listened)enableFallback();else{I.textContent='Tilt back to drink';II.textContent='📱';}},3000);
    }
  },{once:true});
})();
</script>
